name: Npm release tarball smoke
on:
  workflow_dispatch:
    inputs:
      release:
        description: GitHub release tag containing prepared npm tarballs
        required: true
        default: v1.1.0
permissions:
  contents: read
jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win32-x64
          - os: windows-11-arm
            platform: win32-arm64
          - os: macos-15-intel
            platform: darwin-x64
          - os: macos-15
            platform: darwin-arm64
          - os: ubuntu-22.04
            platform: linux-x64
          - os: ubuntu-22.04-arm
            platform: linux-arm64
          - os: ubuntu-22.04
            platform: linux-x64-musl
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Download the exact platform and launcher tarballs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release }}
        run: |
          version=$(node -p 'require("./npm/gnomcode/package.json").version')
          gh release download "$RELEASE_TAG" --pattern "gnomcode-${version}.tgz" --pattern "gnomcode-cli-${{ matrix.platform }}-${version}.tgz" --dir npm-artifacts
      - name: Install and execute published-style packages
        if: matrix.platform != 'linux-x64-musl'
        run: node npm/smoke-tarballs.cjs npm-artifacts
      - name: Install and execute musl packages on Alpine
        if: matrix.platform == 'linux-x64-musl'
        run: docker run --rm --volume "$PWD:/release:ro" node:22-alpine node /release/npm/smoke-tarballs.cjs /release/npm-artifacts
