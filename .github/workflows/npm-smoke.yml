name: Published-style npm smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --release -p gnomcode
      - name: Require approved release legal files
        shell: bash
        run: |
          test -s LICENSE
          test -s web/public/downloads/THIRD_PARTY_NOTICES.html
          if grep -qi '\bdraft\b' LICENSE; then exit 1; fi
      - name: Stage host platform and shim
        shell: bash
        run: |
          target=$(node -p 'process.platform + "-" + process.arch')
          extension=$(node -p 'process.platform === "win32" ? ".exe" : ""')
          node apps/desktop/stage-release.cjs "$target" "target/release/gnomcode${extension}" LICENSE web/public/downloads/THIRD_PARTY_NOTICES.html
          cp LICENSE npm/gnomcode/LICENSE
          cp web/public/downloads/THIRD_PARTY_NOTICES.html npm/gnomcode/THIRD_PARTY_NOTICES.html
      - name: Install tarballs and run standalone commands offline
        run: node npm/smoke-release.cjs
