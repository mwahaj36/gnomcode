name: CI

on:
  # Manual trigger only while conserving private-repo GitHub Actions minutes.
  # All commits and PRs are verified locally via `.agents/skills/rust-quality-gate/scripts/check.ps1`.
  workflow_dispatch:
    inputs:
      package:
        description: Build verified native release archives
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  check:
    name: clippy + test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Validate platform behavior and existing adapters on every supported OS.
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  msrv:
    name: MSRV check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      # `+1.88` overrides rust-toolchain.toml (which pins stable).
      - run: cargo +1.88 check --workspace

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          arguments: ""
          command-arguments: advisories bans sources

  handoff-evals:
    # Report only: a low score never fails the workflow (ADR 0055).
    name: handoff evals (report)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run handoff evals
        env:
          GNOMCODE_HOME: ${{ runner.temp }}/gnomcode-home
        run: |
          cargo run -q -p gnomcode -- evals handoff --no-save | tee "$RUNNER_TEMP/handoff-evals.txt"
          cargo run -q -p gnomcode -- evals handoff --no-save --json > "$RUNNER_TEMP/handoff-evals.json"
          { echo '### Handoff quality evals (estimated, synthetic cases)'; echo '```'; cat "$RUNNER_TEMP/handoff-evals.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: handoff-evals
          path: ${{ runner.temp }}/handoff-evals.json

  package:
    if: inputs.package
    name: native archive (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            argument: linux-x86-64
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            argument: linux-aarch64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            argument: darwin-x86-64
          - os: macos-15
            target: aarch64-apple-darwin
            argument: darwin-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: cargo build --locked --release -p gnomcode
      - run: ./target/release/gnomcode --version
      - run: python scripts/package-artifacts.py --${{ matrix.argument }} target/release/gnomcode
      - run: python scripts/check-unix-installer.py
      - name: Stage current target only
        shell: bash
        run: |
          version=$(./target/release/gnomcode --version | cut -d ' ' -f 2)
          mkdir -p target/release-assets
          cp web/public/downloads/gnomcode-v${version}-*.tar.gz target/release-assets/
      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.target }}
          path: target/release-assets/*.tar.gz
          if-no-files-found: error

  web:
    name: web lint, typecheck and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  console-e2e:
    name: console e2e (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the daemon
        run: cargo build -p gnomcode
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Drive the real console against a fixture daemon
        working-directory: web
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: console-e2e-traces-${{ matrix.os }}
          path: web/test-results
          if-no-files-found: ignore

  desktop:
    name: desktop typecheck and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Configure Electron sandbox helper
        run: |
          node -e "require('electron')"
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - run: xvfb-run -a npm test

  npm-shim:
    name: npm shim (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm test --prefix npm/gnomcode
      - run: node scripts/sync-branding.mjs --check

  package-desktop:
    if: inputs.package
    name: desktop package (${{ matrix.os }} / ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x64
            targets: "@electron-forge/maker-deb,@electron-forge/maker-zip"
          - os: macos-15-intel
            arch: x64
            targets: "@electron-forge/maker-zip"
          - os: macos-15
            arch: arm64
            targets: "@electron-forge/maker-zip"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-about
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Build daemon binary
        run: cargo build --locked --release -p gnomcode
      - name: Stage desktop release inputs
        shell: bash
        run: |
          mkdir -p apps/desktop/staging/bin
          cp target/release/gnomcode apps/desktop/staging/bin/gnomcode
          chmod +x apps/desktop/staging/bin/gnomcode
          cp docs/legal/EULA.txt apps/desktop/staging/EULA.txt
          cargo about generate about.hbs -o apps/desktop/staging/THIRD_PARTY_NOTICES.html
      - name: Build and package desktop app
        working-directory: apps/desktop
        run: |
          npm ci
          node desktop-notices.cjs
          npm run lint
          npm run typecheck
          npm run build
          node check-inputs.cjs
          npx electron-forge make --arch ${{ matrix.arch }} --targets ${{ matrix.targets }}
          find out/make -maxdepth 4 -type f
