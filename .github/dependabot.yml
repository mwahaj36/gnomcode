version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo-minor:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      # MSRV job intentionally pins dtolnay/rust-toolchain@1.85.
      - dependency-name: "dtolnay/rust-toolchain"
