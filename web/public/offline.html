<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Offline | Gnomcode</title>
  <style>
    :root {
      --bg: #070708;
      --card: #0f1115;
      --border: #1f232b;
      --text: #f0f3f6;
      --muted: #8b949e;
      --accent: #f85149;
    }
    body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      text-align: center;
      box-sizing: border-box;
    }
    .container {
      max-width: 420px;
      padding: 32px 24px;
      margin: 16px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    .badge {
      display: inline-block;
      font-family: monospace;
      font-size: 11px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 4px 8px;
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 4px;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 20px;
      margin: 0 0 12px;
      font-weight: 600;
    }
    p {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
      margin: 0 0 24px;
    }
    button {
      background: var(--text);
      color: var(--bg);
      border: none;
      padding: 10px 20px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      font-family: inherit;
    }
    button:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="badge">[OFFLINE]</div>
    <h1>No Connection Available</h1>
    <p>Gnomcode could not establish a connection. When network is restored, reload to reconnect to your agent runtime.</p>
    <button onclick="window.location.reload()">Retry Connection</button>
  </div>
</body>
</html>
