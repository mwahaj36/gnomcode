[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.88"
license-file = "LICENSE"
repository = "https://github.com/mwahaj36/spawnt"
homepage = "https://gnomcode.vercel.app"
authors = ["Wahaj <https://github.com/mwahaj36>"]
publish = false

[workspace.dependencies]
# Internal crates
gnomcode-core = { path = "crates/core" }
gnomcode-adapters = { path = "crates/adapters" }
gnomcode-ingest = { path = "crates/ingest" }
gnomcode-store = { path = "crates/store" }
gnomcode-pty = { path = "crates/pty" }
gnomcode-platform = { path = "crates/platform" }
gnomcode-daemon = { path = "crates/daemon" }
# External dependencies (see AGENTS.md §5).
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "net", "signal", "process"] }
rusqlite = { version = "0.40", features = ["bundled"] }
notify = "8.0"
sysinfo = "0.36"
axum = { version = "0.8", features = ["ws", "macros"] }
tower = { version = "0.5", features = ["util"] }
ed25519-dalek = { version = "2.1", features = ["std"] }
sha2 = "0.11"
hmac = "0.13"
x25519-dalek = "3.0"
aes-gcm = "0.11"
zeroize = "1.9"
getrandom = "0.4"
libc = "0.2"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
toml = "0.8"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
portable-pty = "0.9"
conpty-oxide = "0.1.2"
tempfile = "3.13"
insta = { version = "1.40", features = ["json", "yaml"] }
ruzstd = "0.9.1"
vt100 = "0.15"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "warn"
dbg_macro = "deny"
print_stdout = "warn"
print_stderr = "warn"
undocumented_unsafe_blocks = "deny"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
incremental = false
