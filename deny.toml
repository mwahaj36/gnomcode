# cargo-deny configuration — https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
ignore = []

[licenses]
include-dev = true
unused-allowed-license = "allow"
# Permissive third-party licenses only. Copyleft (GPL/LGPL/AGPL) is strictly forbidden in our closed-source binary.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "MPL-2.0",
]
confidence-threshold = 0.9

[[licenses.clarify]]
name = "fleethud"
expression = "LicenseRef-FleetHUD-Proprietary"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]
# First-party workspace crates are proprietary; allow our own license ref.
exceptions = [
    { allow = ["LicenseRef-FleetHUD-Proprietary"], name = "fleethud" },
    { allow = ["LicenseRef-FleetHUD-Proprietary"], name = "fleethud-core" },
    { allow = ["LicenseRef-FleetHUD-Proprietary"], name = "fleethud-adapters" },
    { allow = ["LicenseRef-FleetHUD-Proprietary"], name = "fleethud-store" },
    { allow = ["LicenseRef-FleetHUD-Proprietary"], name = "fleethud-platform" },
    { allow = ["LicenseRef-FleetHUD-Proprietary"], name = "fleethud-ingest" },
    { allow = ["LicenseRef-FleetHUD-Proprietary"], name = "fleethud-daemon" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
