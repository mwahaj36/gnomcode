# cargo-deny configuration — https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
ignore = [
    # RUSTSEC-2026-0459: upstream C SQLite WAL page-cache advisory bundled in rusqlite 0.40.2 / libsqlite3-sys 0.38.2.
    # Local-only database files accessed through validated loopback daemon paths.
    "RUSTSEC-2026-0459",
]

[licenses]
include-dev = true
unused-allowed-license = "allow"
# Permissive third-party licenses only. Copyleft (GPL/LGPL/AGPL) is strictly forbidden in our closed-source binary.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0", # TLS root certificate data; include license in notices.
    "MPL-2.0",
]
confidence-threshold = 0.9

# Gnomcode is proprietary and all workspace crates have publish = false.
# Third-party dependency licenses are still checked against the allow-list above.
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
