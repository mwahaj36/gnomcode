# fly.toml app configuration file generated for gnomcode-remote-relay on 2026-11-28T16:08:33+05:00
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'gnomcode-remote-relay'
primary_region = 'sjc'

[build]
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    grace_period = "5s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
